[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agiopen"
version = "0.1.0"
description = "Open-source horticultural lighting simulation that produces AGi32-style PPFD summary reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "reportlab>=4.0"]

[project.optional-dependencies]
intake = ["anthropic>=0.40", "python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
agiopen = "agiopen.cli:main"

[tool.setuptools.packages.find]
include = ["agiopen*"]

[tool.setuptools.package-data]
agiopen = ["intake/prompt.md"]
